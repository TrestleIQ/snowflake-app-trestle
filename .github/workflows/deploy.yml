# CI for the Snowflake Native App (TRES-7206).
#
# build    - offline: compile handlers + `snow app bundle`. No Snowflake login.
# validate - logs in as the service user SVC_SNOWFLAKE_APP_CI (TYPE=SERVICE, key-pair/JWT auth,
#            role APP_DEPLOYER) and runs `snow app validate` + `snow app run` against a CI-only
#            package/app (TRESTLE_VALIDATE_PHONE_PACKAGE_CI / TRESTLE_VALIDATE_PHONE_CI).
#            APP_DEPLOYER has no privileges on the production package TRESTLE_VALIDATE_PHONE_PACKAGE.
#
# Releasing stays MANUAL and human-run: `snow app version create` and
# `snow app release-directive set default` must never be added to this workflow.

name: Build Snowflake Native App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

env:
  SNOWFLAKE_CLI_VERSION: "3.34.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          pip install "snowflake-cli==${SNOWFLAKE_CLI_VERSION}"
          snow --version

      - name: Compile Python handlers
        run: |
          cd phone_validation
          python -m py_compile app/src/udf1.py app/src/udf.py

      - name: Bundle app (offline)
        run: |
          cd phone_validation
          rm -rf output app/src/__pycache__
          snow app bundle

  validate:
    needs: build
    # Fork PRs never receive secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Secrets live in this environment; its required reviewers gate every run.
    environment: snowflake-ci
    # One run at a time against the shared CI package.
    concurrency:
      group: snowflake-ci-app
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          pip install "snowflake-cli==${SNOWFLAKE_CLI_VERSION}"

      - name: Write private key
        env:
          SNOWFLAKE_CI_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_CI_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_ci_key.p8"

      - name: Point project at the CI package
        # snowflake.local.yml is merged over snowflake.yml by the CLI; it is git-ignored.
        run: |
          cat > phone_validation/snowflake.local.yml <<'EOF'
          definition_version: 2
          entities:
            pkg:
              identifier: TRESTLE_VALIDATE_PHONE_PACKAGE_CI
            app:
              identifier: TRESTLE_VALIDATE_PHONE_CI
          EOF

      - name: Validate and test-deploy (CI package only)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE }}
        run: |
          cd phone_validation
          rm -rf output app/src/__pycache__
          CONN=(-x
            --account "$SNOWFLAKE_ACCOUNT"
            --user "$SNOWFLAKE_USER"
            --authenticator SNOWFLAKE_JWT
            --private-key-file "$RUNNER_TEMP/snowflake_ci_key.p8"
            --role APP_DEPLOYER
            --warehouse COMPUTE_XS)
          snow connection test "${CONN[@]}"
          snow app validate "${CONN[@]}"
          # --force answers CLI prompts (e.g. recreate the CI app); APP_DEPLOYER cannot touch prod.
          snow app run --no-validate --force "${CONN[@]}"

      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_ci_key.p8"

  notify:
    needs: [ build, validate ]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: `❌ Build/validate failed! Check the [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for details.`
            });
