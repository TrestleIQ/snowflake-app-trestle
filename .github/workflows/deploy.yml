# Offline build check for the Snowflake Native App.
#
# This workflow intentionally does NOT log in to Snowflake. Snowflake now
# requires MFA on every password login, which a headless runner cannot satisfy,
# so the old CHANDRATRESTLE password login was removed. Deploying (validate /
# app run / version / release-directive) is done manually for now; it will
# return here once a TYPE=SERVICE user with key-pair auth is set up (see CLAUDE.md).

name: Build Snowflake Native App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          # click 8.2+ breaks the typer version bundled with CLI 3.4.1 (make_metavar 'ctx' error)
          pip install snowflake-cli-labs==3.4.1 "click<8.2"
          snow --version

      - name: Compile Python handlers
        run: |
          cd phone_validation
          python -m py_compile app/src/udf1.py app/src/udf.py

      - name: Bundle app (offline)
        run: |
          cd phone_validation
          rm -rf output app/src/__pycache__
          snow app bundle

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            if (context.issue.number) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ Build failed! Check the [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for details.`
              });
            }
